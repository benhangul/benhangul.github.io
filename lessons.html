<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lessons — Korean Steps: Learn Korean</title>
<meta name="description" content="Learn Korean right here — the full Korean Steps app in your browser: 1,000 lessons, games, wordbook and TOPIK exams. Free, no install.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --green:#58cc02; --green-dark:#46a302; --blue:#1cb0f6; --blue-dark:#1899d6; --ink:#3c3c3c; --line:#e5e5e5; --blue-soft:#ddf4ff; --accent:#1cb0f6; --muted:#777777; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#fff8e9;display:flex;flex-direction:column}
  header{border-bottom:2px solid var(--line);background:rgba(255,255,255,.97);flex:0 0 auto}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}
  .bar{display:flex;align-items:center;gap:12px;padding:10px 0}
  .bar img{width:40px;height:40px;object-fit:contain}
  .brand{font-weight:900;font-size:21px;letter-spacing:.2px}
  .brand span{color:var(--green)}
  .bar .sp{flex:1}
  .menu{display:flex;align-items:center;gap:4px}
  .menu a.mlink,.menu button.mlink{font-weight:900;font-size:15px;color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:10px;background:none;border:0;cursor:pointer;font-family:inherit}
  .menu a.mlink:hover,.menu button.mlink:hover{background:var(--blue-soft)}
  .menu button.mlink:disabled{opacity:.55;cursor:default}
  @media (max-width:560px){ .menu a.mlink,.menu button.mlink{padding:8px 7px;font-size:14px} .brand{font-size:18px} }
  .btn{display:inline-block;background:var(--green);color:#fff;font-weight:900;text-decoration:none;
       padding:12px 22px;border-radius:14px;box-shadow:0 4px 0 var(--green-dark);font-size:16px;border:0;cursor:pointer;font-family:inherit}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-dark)}
  .btn.small{padding:9px 16px;font-size:14px}
  @media (max-width:700px){ .menu a.hideS{display:none} }
  /* The app's own blue status bar, transplanted into this header on login
     (Ben 2026-10-23: "원래있던것처럼" — the original bar itself, not new chips).
     Rules below mirror the app's status-bar CSS; the bar node is a live clone
     of the app's .status-box with its ids swapped to data-oid. */
  /* Mini version of the bar, sitting small beside the brand in the top bar
     (Ben 2026-10-23: "korean steps 상단바 옆에 작게"). */
  #siteHud{display:none;align-items:center;margin-left:6px}
  #siteHud.on{display:inline-flex}
  #hudMount{transform-origin:0 50%;transform:scaleX(.15);opacity:0;transition:transform .65s cubic-bezier(.22,1,.36,1) .05s,opacity .3s ease .05s}
  #siteHud.grow #hudMount{transform:scaleX(1);opacity:1}
  #siteHud .status-box{display:inline-flex;margin:0;padding:3px 12px 3px 8px;gap:6px}
  #siteHud .status-box>.me-cluster{flex:0 0 auto}
  #siteHud .status-box>.coin-pill{flex:0 0 auto}
  #siteHud [data-oid="levelLabel"]{padding:2px 3px}
  #siteHud [data-oid="levelLabel"] .rank-chick{width:20px;height:23px}
  #siteHud .coin-pill,#siteHud .streak-pill{font-size:.8rem;padding:2px 3px}
  #siteHud .status-divider{height:18px}
  @media (max-width:640px){ .bar{flex-wrap:wrap} }
  #hudMount [hidden]{display:none!important} /* the app enforces this globally; the clone needs it too, or the hidden sign-in pill / streak pill would show */
  .status-box{max-width:100%}
  .status-box .coin-pill,.status-box .user-pill{min-width:0;white-space:nowrap}
  [data-oid="levelLabel"]{display:inline-flex;align-items:center;gap:7px;background:transparent;border:none;padding:4px 6px;font-weight:800;font-size:.9rem;color:var(--ink);cursor:pointer;font-family:inherit;flex:0 0 auto;white-space:nowrap}
  [data-oid="levelLabel"] .rank-chick{width:26px;height:30px}
  [data-oid="levelLabel"] .rank-chick svg{width:100%;height:100%;display:block}
  .status-box{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border:2px solid var(--blue);border-radius:999px;padding:6px 18px 6px 14px;box-sizing:border-box;overflow:hidden;flex:1 1 auto;justify-content:flex-start}
  .status-box .coin-pill{flex:0 0 auto;justify-content:center;white-space:nowrap}
  .status-box>.coin-pill,.status-box>.streak-pill,.status-box>.user-pill{flex:0 0 auto;justify-content:center}
  .status-box>.user-pill{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .status-box>.me-cluster{flex:1 1 0;justify-content:center}
  .status-box>.coin-pill{flex:1 1 0}
  .status-box>.user-pill{flex:1 1 0;min-width:0}
  .status-box>[data-oid="levelLabel"]{flex:0 0 auto}
  .me-cluster{display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;padding:0 2px}
  .me-cluster .streak-pill{flex:0 0 auto;cursor:pointer}
  .status-box>.status-divider{flex:0 0 auto}
  .status-box .user-pill{flex:0 1 auto;min-width:0;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [data-oid="loginBtn"]>span{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .status-divider{width:2px;height:24px;background:#e5e5e5;border-radius:2px;flex-shrink:0}
  .rank-tap{cursor:pointer;flex-shrink:0;min-width:0}
  .rank-tap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .coin-pill{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;padding:4px 6px;font-weight:800;font-size:.85rem;color:var(--accent);cursor:pointer;font-family:inherit;line-height:1.4}
  .coin-pill:active{transform:scale(.95)}
  .user-pill{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;padding:4px 6px;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;font-family:inherit;line-height:1.4;white-space:nowrap}
  .user-pill:active{transform:scale(.95)}
  .streak-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;font-weight:800;font-size:.85rem;color:#e8590c;white-space:nowrap;flex:0 0 auto;line-height:1.4;cursor:pointer}
  @media (max-width:400px){
    .status-box{gap:4px;padding:6px 8px 6px 6px}
    .me-cluster{gap:5px;padding:0}
    [data-oid="levelLabel"]{font-size:.82rem;padding:4px 1px}
    .status-box .streak-pill{padding:4px 1px;gap:2px;font-size:.8rem}
    .coin-pill{font-size:.76rem}
    .user-pill{font-size:.74rem}
    .status-box .coin-pill,.status-box .user-pill{padding:4px 2px}
  }
  .stage{flex:1 1 auto;display:flex;min-height:0}
  .stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body>
<header>
  <div class="wrap bar">
    <img src="chick.png" alt="Korean Steps chick mascot">
    <div class="brand">Korean <span>Steps</span></div>
    <div id="siteHud"><div id="hudMount"></div></div>
    <div class="sp"></div>
    <nav class="menu">
      <a class="mlink" href="lessons.html">Lessons</a>
      <a class="mlink hideS" href="index.html#features">Features</a>
      <a class="mlink hideS" href="about.html">About</a>
      <button class="mlink" id="siteLogin" type="button">Login</button>
      <a class="btn blue small" href="https://play.google.com/store/apps/details?id=com.benhangul.koreansteps">Get the app</a>
    </nav>
  </div>
</header>
<div class="stage">
  <iframe id="appFrame" src="play.html?site=1" title="Korean Steps — learn Korean" allow="autoplay"></iframe>
</div>
<script>
const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyBeemXNPL9CqOtSKFFNBudBGAuDklgqBRg',
      authDomain: 'korean-steps.firebaseapp.com',
      projectId: 'korean-steps',
      storageBucket: 'korean-steps.appspot.com',
      messagingSenderId: '917121892105',
      appId: '1:917121892105:android:737c1456b2573821ce9dd8'
    };
  var siteAuth=null;
  try{
    if(typeof firebase!=='undefined'){
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      siteAuth=firebase.auth();
      var btn=document.getElementById('siteLogin');
      siteAuth.getRedirectResult().catch(function(e){
        var msg=String((e&&e.message)||'')+(e&&e.code?' [code '+e.code+']':'');
        if(msg && !/cancel/i.test(msg)) alert('Sign-in failed: '+msg+'\n\nIf this mentions an unauthorized domain, add koreansteps.com in Firebase Console > Authentication > Settings > Authorized domains.');
      });
      siteAuth.onAuthStateChanged(function(user){
        if(user){
          btn.textContent='Sign out';
          btn.title='Signed in as '+(user.email||'');
        }else{
          btn.textContent='Login';
          btn.title='';
        }
        btn.disabled=false;
      });
      btn.addEventListener('click', function(){
        if(siteAuth.currentUser){
          siteAuth.signOut();
        }else{
          btn.disabled=true;
          siteAuth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(function(e){
            btn.disabled=false;
            alert('Sign-in failed: '+String((e&&e.message)||e));
          });
        }
      });
    }
  }catch(e){}
</script>
<script>
// Header status bar (Ben 2026-10-23): on login success the app's OWN blue
// status bar appears in this header — a live clone of the framed app's
// .status-box (ids swapped to data-oid, taps forwarded to the app's real
// buttons) — growing in with a stretch animation. Signed out: it collapses
// away and the app keeps its own bar.
(function(){
  var hud=document.getElementById('siteHud');
  var mount=document.getElementById('hudMount');
  var frame=document.getElementById('appFrame');
  if(!hud||!mount||!frame) return;
  var lastHTML='', hideTimer=null;
  function doc(){ try{ return frame.contentDocument; }catch(e){ return null; } }
  function sync(){
    var d=doc(); if(!d) return;
    try{
      var sb=d.querySelector('.status-box'); if(!sb) return;
      var c=sb.cloneNode(true);
      var lb=c.querySelector('#loginBtn');
      if(lb && lb.hidden){ var dv=lb.previousElementSibling; if(dv && dv.classList && dv.classList.contains('status-divider')) dv.remove(); }
      var html=c.outerHTML.replace(/ id="/g,' data-oid="');
      if(html!==lastHTML){ lastHTML=html; mount.innerHTML=html; }
    }catch(e){}
  }
  mount.addEventListener('click', function(ev){
    var t=(ev.target&&ev.target.closest)?ev.target.closest('[data-oid]'):null;
    if(!t) return;
    var d=doc(); if(!d) return;
    var el=d.getElementById(t.getAttribute('data-oid'));
    if(el) el.click();
  });
  function show(){
    clearTimeout(hideTimer);
    hud.classList.add('on');
    sync();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ hud.classList.add('grow'); }); });
  }
  function hide(){
    hud.classList.remove('grow');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(function(){ hud.classList.remove('on'); },700);
  }
  if(window.siteAuth){
    window.siteAuth.onAuthStateChanged(function(user){ if(user) show(); else hide(); });
  }
  frame.addEventListener('load', sync);
  setInterval(sync, 800);
})();
</script>
</body>
</html>
