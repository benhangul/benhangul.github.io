<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean Steps: Learn Korean — Official Site</title>
<meta name="description" content="Learn Korean step by step with Korean Steps — 1,000 bite-size lessons, games, a picture wordbook and TOPIK mock exams. Start learning right here in your browser, free.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff8e9}
  body{display:flex;justify-content:center}
  #app{width:min(430px,100%);height:100%;border:0;display:block;box-shadow:0 0 44px rgba(120,90,20,.14)}
  #getApp{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:10;display:flex;align-items:center;gap:7px;
    background:#58cc02;color:#fff;font-family:'Nunito',system-ui,sans-serif;font-weight:900;font-size:13.5px;
    text-decoration:none;padding:9px 13px;border-radius:999px;box-shadow:0 3px 0 #46a302,0 8px 18px rgba(30,60,20,.22);
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #getApp:active{cursor:grabbing}
  #getApp .x{opacity:.85;font-weight:900;padding:2px 4px;margin-right:-6px;cursor:pointer}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
<iframe id="app" src="play.html" title="Korean Steps — learn Korean" allow="autoplay"></iframe>
<a id="getApp" href="https://play.google.com/store/apps/details?id=com.benhangul.koreansteps">
  📱 Get the app — free <span class="x" id="getAppX" title="Dismiss">✕</span>
</a>
<script>
  var pill = document.getElementById('getApp');
  document.getElementById('getAppX').addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    pill.style.display='none';
  });
  // Drag the pill out of the way (touch or mouse). A real drag suppresses the link tap.
  var drag=null, moved=false;
  pill.addEventListener('pointerdown', function(e){
    if(e.target.id==='getAppX') return;
    var r=pill.getBoundingClientRect();
    drag={dx:e.clientX-r.left, dy:e.clientY-r.top, sx:e.clientX, sy:e.clientY};
    moved=false;
    pill.setPointerCapture(e.pointerId);
  });
  pill.addEventListener('pointermove', function(e){
    if(!drag) return;
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>8) moved=true;
    if(!moved) return;
    var x=e.clientX-drag.dx, y=e.clientY-drag.dy;
    x=Math.max(4, Math.min(x, window.innerWidth-pill.offsetWidth-4));
    y=Math.max(4, Math.min(y, window.innerHeight-pill.offsetHeight-4));
    if(!moved && (Math.abs(e.movementX)+Math.abs(e.movementY))>0) moved=true;
    pill.style.left=x+'px'; pill.style.top=y+'px';
    pill.style.right='auto'; pill.style.bottom='auto'; pill.style.transform='none';
  });
  pill.addEventListener('pointerup', function(){ drag=null; });
  pill.addEventListener('click', function(e){ if(moved){ e.preventDefault(); moved=false; } });
</script>
</body>
</html>
